name: Fetch COT Data

on:
  # Every Friday at 21:45 UTC (after 3:30 PM ET in both EST=UTC-5 and EDT=UTC-4)
  schedule:
    - cron: '45 21 * * 5'
  # Allow manual trigger with mode selection
  workflow_dispatch:
    inputs:
      mode:
        description: 'Fetch mode'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - historical
          - reprocess

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetcher
        run: python scripts/fetch.py --mode ${{ inputs.mode || 'incremental' }}

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "data: COT update $(date -u +%Y-%m-%d)"
            git push
          fi
